// 业务错误码契约：bare enum，不 import 任何 proto；业务码用 ErrorReason_X.String() 构建。
syntax = "proto3";

package identity.v1;

option go_package = "github.com/phantom5099/spreader/api/identity/v1;v1";

// ErrorReason IAM 统一业务错误码（IAM.<REASON>，外部以 problem+json 的 code 扩展成员暴露）。
enum ErrorReason {
  // 未指定。
  ERROR_REASON_UNSPECIFIED = 0;
  // type 缺失/未知/该方式被配置停用。
  IAM_UNSUPPORTED_LOGIN_TYPE = 1;
  // 60s 内重复发码。
  IAM_OTP_SEND_TOO_FREQUENT = 2;
  // 日额度用尽。
  IAM_OTP_DAILY_LIMIT_EXCEEDED = 3;
  // 验证码错误/过期/尝试过多（合并为一码，防枚举）。
  IAM_OTP_INVALID = 4;
  // 账号不存在或密码错误（统一为一码，防枚举）。
  IAM_INVALID_CREDENTIALS = 5;
  // 密码连续错误超限，锁定窗口内拒绝。
  IAM_ACCOUNT_LOCKED = 6;
  // 凭据验证通过但账号已封禁，不签发令牌。
  IAM_ACCOUNT_BANNED = 7;
  // 第三方回调 state 校验失败（过期/不匹配/已消费）。
  IAM_OAUTH_STATE_INVALID = 8;
  // RT 重放（整个 family 已撤销）。
  IAM_REFRESH_TOKEN_REUSED = 9;
  // AT 过期/无效（配 WWW-Authenticate 头）。
  IAM_TOKEN_EXPIRED = 10;
  // 触发式人机校验缺失。
  IAM_CAPTCHA_REQUIRED = 11;
  // 人机校验未过；未过可重新挑战，重复失败由风控计数触发退避/冷却。
  IAM_CAPTCHA_FAILED = 12;
  // 验证码/人机验证/第三方通道全不可用（熔断后）。
  IAM_CHANNEL_UNAVAILABLE = 13;
  // 第三方换取失败/用户取消（mock：code 过期/已消费）。
  IAM_THIRDPARTY_AUTH_FAILED = 14;
  // 请求参数不合法。
  IAM_BAD_REQUEST = 15;
  // 尝试过于频繁（IP/设备维度频控）。
  IAM_TOO_MANY_ATTEMPTS = 16;
}
