# 密钥占位（⚠️ 本地开发值，仅演示流程；生产用真实值走 kubectl create secret
# 或外部 KMS——仓库零秘密是硬规则，此文件不得填入真实凭据后提交）。
apiVersion: v1
kind: Secret
metadata:
  name: identity-secret
  namespace: spreader
type: Opaque
stringData:
  IDENTITY_PG_DSN: "postgres://spreader:spreader@host.docker.internal:15432/spreader_loadtest?sslmode=disable"
  IDENTITY_JWT_SECRET: "dev-only-jwt-secret-32bytes-min"
  IDENTITY_OTP_PEPPER: "dev-only-otp-pepper"
  IDENTITY_ARGON_PEPPER: "dev-only-argon-pepper"
