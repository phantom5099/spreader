# 用法：
#   docker compose -f deploy/compose/docker-compose.yml up -d
#   docker compose -f deploy/compose/docker-compose.yml down          # 停止（保留卷）
#   docker compose -f deploy/compose/docker-compose.yml down -v       # 停止并清除数据
#
# 端口统一避开本机常用端口，映射到 1xxxx 段，避免与本机其他服务冲突。
# 数据卷落在 deploy/compose/data/（已 gitignore）。

name: spreader-dev

services:
  # ===== 关系型数据库：PostgreSQL 18（§3.2.1；UUIDv7 需 18+，§3.6.16）=====
  postgres:
    image: postgres:18-alpine
    container_name: spreader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spreader
      POSTGRES_PASSWORD: spreader
      POSTGRES_DB: spreader
      # 开发环境放宽本地连接
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "15432:5432"
    volumes:
      # postgres:18+ 数据目录布局变化，官方建议挂载父目录（见 docker-library/postgres#37）
      - ./data/postgres:/var/lib/postgresql
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spreader -d spreader"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spreader-dev

  # ===== 缓存：Redis 7（§3.2.2；分片 Pub/Sub 需 7+，§3.6.17）=====
  redis:
    image: redis:7-alpine
    container_name: spreader-redis
    restart: unless-stopped
    # 开发环境关闭持久化、开启 AOF 便于观察；生产按 §3.2.2 的持久化策略
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "16379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spreader-dev

  # ===== 可观测：Prometheus（抓 server 进程的 9100 管理端点）=====
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: spreader-prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 容器内访问宿主机的 9100
    networks:
      - spreader-dev

  # ===== 可观测：Grafana（localhost:13000，预置 Prometheus 数据源与 server 仪表盘）=====
  grafana:
    image: grafana/grafana:11.3.0
    container_name: spreader-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "13000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - spreader-dev

networks:
  spreader-dev:
    driver: bridge
